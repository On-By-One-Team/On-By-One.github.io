name: Controllo Link Sito

on:
  workflow_run:
    workflows: ["Compila documenti LaTeX"]
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'assets/**'
      - 'docs/pdf/**'
      - '.github/workflows/link-check.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - 'assets/**'
      - 'docs/pdf/**'
      - '.github/workflows/link-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Verifica link interni, esterni e PDF
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress "website/index.html"
          fail: true
