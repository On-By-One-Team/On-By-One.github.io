name: Aggiorna registro delle modifiche

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: change-log-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  update-from-pull-request:
    if: >-
      github.event_name == 'pull_request_target'
      && (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    steps:
      - name: Verifica repository del branch
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Il workflow aggiorna solo branch appartenenti al repository principale."
          exit 1
      - name: Checkout del branch della Pull Request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Prepara lo script attendibile e il branch della Pull Request
        run: |
          cp scripts/docs-versioning.py "$RUNNER_TEMP/docs-versioning.py"
          mkdir -p "$RUNNER_TEMP/compile-latex"
          cp -r .github/actions/compile-latex/* "$RUNNER_TEMP/compile-latex/"
          git fetch origin "${{ github.event.pull_request.head.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          mkdir -p .github/actions/compile-latex
          cp -r "$RUNNER_TEMP/compile-latex/"* .github/actions/compile-latex/
      - name: Aggiorna le righe della Pull Request
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          RECIPIENT_TYPE=""
          for label in client proposer; do
            if [[ " ${{ join(github.event.pull_request.labels.*.name, ' ') }} " == *" $label "* ]]; then
              if [[ -n "$RECIPIENT_TYPE" ]]; then
                echo "::error::Usare una sola label tra client e proposer"
                exit 1
              fi
              RECIPIENT_TYPE="$label"
            fi
          done
          RECIPIENT_ARGS=()
          if [[ -n "$RECIPIENT_TYPE" ]]; then
            RECIPIENT_ARGS=(--recipient-type "$RECIPIENT_TYPE")
          fi
          CHANGELOG_ROOT="$GITHUB_WORKSPACE" python "$RUNNER_TEMP/docs-versioning.py" pr \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --author-id "${{ github.event.pull_request.user.id }}" \
            --date "${{ github.event.pull_request.updated_at }}" \
            "${RECIPIENT_ARGS[@]}"
      - name: Trova i .tex da compilare
        run: |
          : > changed.txt
          : > deleted.txt
          git diff --name-status --diff-filter=AMDR "${{ github.event.pull_request.base.sha }}" -- ':(glob)docs/tex/**/*.tex' |
            while IFS="$(printf '\t')" read -r status old_path new_path; do
              case "$status" in
                A|M) echo "$old_path" >> changed.txt ;;
                D) echo "$old_path" >> deleted.txt ;;
                R*) echo "$old_path" >> deleted.txt; echo "$new_path" >> changed.txt ;;
              esac
            done
          echo "File da compilare:"
          cat changed.txt
          echo "PDF da rimuovere:"
          cat deleted.txt
      - name: Compila i documenti LaTeX
        uses: ./.github/actions/compile-latex
        with:
          changed-files: changed.txt
          deleted-files: deleted.txt
      - name: Commit e push delle righe e dei PDF aggiornati
        run: |
          if git diff --quiet docs/tex/ docs/pdf/; then
            echo "Nessuna modifica a registro o PDF da aggiornare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tex/ docs/pdf/
          git commit -m "docs: aggiornato registro e PDF PR #${{ github.event.pull_request.number }} [skip ci]"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

  update-from-review:
    if: github.event_name == 'pull_request_review' && (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    steps:
      - name: Verifica repository del branch
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Il workflow aggiorna solo branch appartenenti al repository principale."
          exit 1
      - name: Checkout del branch della Pull Request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Prepara lo script attendibile e il branch della Pull Request
        run: |
          cp scripts/docs-versioning.py "$RUNNER_TEMP/docs-versioning.py"
          mkdir -p "$RUNNER_TEMP/compile-latex"
          cp -r .github/actions/compile-latex/* "$RUNNER_TEMP/compile-latex/"
          git fetch origin "${{ github.event.pull_request.head.sha }}"
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          mkdir -p .github/actions/compile-latex
          cp -r "$RUNNER_TEMP/compile-latex/"* .github/actions/compile-latex/
      - name: Aggiorna versione e verificatore
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          RECIPIENT_TYPE=""
          for label in client proposer; do
            if [[ " $PR_LABELS " == *" $label "* ]]; then
              if [[ -n "$RECIPIENT_TYPE" ]]; then
                echo "::error::Usare una sola label tra client e proposer"
                exit 1
              fi
              RECIPIENT_TYPE="$label"
            fi
          done
          RECIPIENT_ARGS=()
          if [[ -n "$RECIPIENT_TYPE" ]]; then
            RECIPIENT_ARGS=(--recipient-type "$RECIPIENT_TYPE")
          fi
          KIND=""
          for label in completed-milestone major minor; do
            if [[ " $PR_LABELS " == *" $label "* ]]; then
              if [[ -n "$KIND" ]]; then
                echo "::error::Usare una sola label tra completed-milestone, major e minor"
                exit 1
              fi
              KIND="$label"
            fi
          done
          KIND_ARGS=()
          if [[ -n "$KIND" ]]; then
            KIND_ARGS=(--kind "$KIND")
          fi
          CHANGELOG_ROOT="$GITHUB_WORKSPACE" python "$RUNNER_TEMP/docs-versioning.py" review \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --reviewer-id "${{ github.event.review.user.id }}" \
            --state "${{ github.event.review.state }}" \
            --date "${{ github.event.review.submitted_at }}" \
            "${RECIPIENT_ARGS[@]}" \
            "${KIND_ARGS[@]}"
      - name: Trova i .tex da compilare
        run: |
          : > changed.txt
          : > deleted.txt
          git diff --name-status --diff-filter=AMDR "${{ github.event.pull_request.base.sha }}" -- ':(glob)docs/tex/**/*.tex' |
            while IFS="$(printf '\t')" read -r status old_path new_path; do
              case "$status" in
                A|M) echo "$old_path" >> changed.txt ;;
                D) echo "$old_path" >> deleted.txt ;;
                R*) echo "$old_path" >> deleted.txt; echo "$new_path" >> changed.txt ;;
              esac
            done
          echo "File da compilare:"
          cat changed.txt
          echo "PDF da rimuovere:"
          cat deleted.txt
      - name: Compila i documenti LaTeX
        uses: ./.github/actions/compile-latex
        with:
          changed-files: changed.txt
          deleted-files: deleted.txt
      - name: Commit e push della revisione e dei PDF
        run: |
          if git diff --quiet docs/tex/ docs/pdf/; then
            echo "Nessuna modifica a registro o PDF da aggiornare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tex/ docs/pdf/
          git commit -m "docs: aggiornato registro revisione e PDF PR #${{ github.event.pull_request.number }} [skip ci]"
          git pull --rebase origin "${{ github.event.pull_request.head.ref }}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
