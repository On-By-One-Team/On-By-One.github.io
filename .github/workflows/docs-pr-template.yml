name: Template descrizione documentazione

on:
  pull_request_target:
    types: [labeled, opened]

permissions:
  pull-requests: write

jobs:
  add-description-tag:
    if: contains(github.event.pull_request.labels.*.name, 'documentation')
    runs-on: ubuntu-latest
    steps:
      - name: Inserisci il tag description nella descrizione della PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -qE '<!--\s*description\s*-->'; then
            echo "Il tag description è già presente nella descrizione"
            exit 0
          fi
          {
            if [ -n "$PR_BODY" ]; then
              printf '%s\n\n' "$PR_BODY"
            fi
            printf '<!-- description -->\n\n<!-- /description -->\n'
          } > "$RUNNER_TEMP/pr-body.txt"
          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/pr-body.txt"
