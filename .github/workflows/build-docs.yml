name: Compila documenti LaTeX

# Il workflow si attiva sui branch di lavoro quando sono stati toccati dei
# file .tex. Compila solo i .tex aggiunti o modificati dal commit.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'docs/tex/**/*.tex'
  workflow_dispatch: # Permette di lanciarlo a mano dalla tab Actions (compila tutto)

# Permessi necessari alla Action per poter fare il commit dei PDF sulla repo
permissions:
  contents: write

concurrency:
  # Impedisce a due esecuzioni dello stesso branch di fare commit contemporaneamente.
  # Il job già in corso non viene annullato; un eventuale job successivo resta in coda.
  group: build-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_latex:
    # Evita di generare PDF su main anche quando il workflow viene avviato a mano.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Scarica tutta la cronologia, serve per il git diff e per il push

      - name: Trova i .tex aggiunti o modificati dal commit
        run: |
          BEFORE="${{ github.event.before }}"
          : > changed.txt
          : > deleted.txt

          # Un avvio manuale deve rigenerare tutti i documenti.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            find docs/tex -name "*.tex" > changed.txt
          # Al primo push del branch, confronta le modifiche con main.
          elif [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            DIFF_RANGE="origin/main...${{ github.sha }}"
          else
            # Nei push successivi, considera solo il commit appena ricevuto.
            DIFF_RANGE="$BEFORE ${{ github.sha }}"
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            # name-status restituisce lo stato e i percorsi separati da tab:
            # per i rename, old_path è il percorso precedente e new_path quello nuovo.
            git diff --name-status --diff-filter=AMDR $DIFF_RANGE -- ':(glob)docs/tex/**/*.tex' |
              while IFS="$(printf '\t')" read -r status old_path new_path; do
                case "$status" in
                  A|M) echo "$old_path" >> changed.txt ;;
                  # Un rename richiede la rimozione del PDF vecchio e la compilazione del nuovo.
                  D) echo "$old_path" >> deleted.txt ;;
                  R*) echo "$old_path" >> deleted.txt; echo "$new_path" >> changed.txt ;;
                esac
              done
          fi
          echo "File da compilare:"
          cat changed.txt
          echo "PDF da rimuovere:"
          cat deleted.txt
        
      - name: Compila i file LaTeX
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace ghcr.io/xu-cheng/texlive-alpine:latest sh -c '
            while read tex_file; do
              # Ignora i modelli
              case "$tex_file" in docs/tex/templates/*) continue ;; esac
             
              # Salta i file che non contengono \documentclass
              grep -q "documentclass" "$tex_file" || continue
              
              # Calcola dinamicamente la cartella di destinazione
              outdir=$(dirname "$tex_file" | sed "s|^docs/tex|docs/pdf|")
              mkdir -p "$outdir"
              
              echo "Compilando: $tex_file in $outdir"
              latexmk -pdf -interaction=nonstopmode -output-directory="$outdir" "$tex_file"
            done < changed.txt
          '

      - name: Pulizia file temporanei di LaTeX
        run: |
          # Elimina i file spazzatura di latexmk, tenendo solo .pdf e .gitkeep
          find docs/pdf -type f -not -name '*.pdf' -not -name '.gitkeep' -delete

          # Rimuove i PDF dei documenti LaTeX eliminati o rinominati
          while IFS= read -r tex_file; do
            # La struttura delle cartelle sotto docs/tex e docs/pdf è identica.
            pdf_file="${tex_file/docs\/tex/docs\/pdf}"
            pdf_file="${pdf_file%.tex}.pdf"
            rm -f "$pdf_file"
          done < deleted.txt

      - name: Commit e push dei PDF generati
        run: |
          # Usa l'utente di sistema di GitHub per firmare il commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Mette in stage solo la cartella dei PDF
          git add docs/pdf/
          
          # Fa il commit rispettando la nomenclatura imposta da WoW (tipo: descrizione)
          # Il tag [skip ci] impedisce a questo commit di far ripartire il workflow
          git commit -m "docs: aggiornamento automatico PDF [skip ci]" || echo "Nessuna modifica al PDF"
          
          # Se il branch è avanzato mentre il job girava, riallinea prima di pushare
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
